<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Barbería — Panel del dueño</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <h1>Panel del dueño</h1>

    <h2>Horario de atención</h2>
    <form id="schedule-form">
      <label>
        Duración de cada turno (minutos)
        <input type="number" id="slot-duration" min="1" step="1" required />
      </label>

      <div id="days-container"></div>

      <button type="submit">Guardar horario</button>
      <p class="error" id="schedule-error" hidden></p>
      <p id="schedule-success" hidden>Horario guardado correctamente.</p>
    </form>

    <h2>Todas las reservas</h2>
    <button id="refresh-bookings">Actualizar</button>
    <ul class="bookings" id="all-bookings-list"></ul>
    <p id="all-bookings-empty" hidden>No hay reservas todavía.</p>

    <script type="module" src="/js/admin.js"></script>
  </body>
</html>
